name: Extract init_boot.img from OnePlus ROM

on:
  watch:
    types: [started]
env:
  FIRMWARE_LINK: https://gauss-opexcostmanual-cn.allawnfs.com/remove-01f9640d3ee4b6da39f6081e0284a07c/component-ota/25/06/12/80d763eee95c49a8b5f4d048e1706e89.zip
  TARGET_NAME: init_boot

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: 清理磁盘空间 (防止大型 ROM 包导致空间不足)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: 下载并安装 payload-dumper-go
        run: |
          LATEST_URL='https://github.com/xishang0128/payload-dumper-go/releases/download/v0.1.6/payload-dumper-linux-amd64-v3.tar.gz'
          wget -q "$LATEST_URL" -O payload-dumper-linux-amd64-v3.tar.gz
          tar -xzf payload-dumper-linux-amd64-v3.tar.gz
          chmod +x payload-dumper-linux-amd64-v3
          sudo mv payload-dumper-linux-amd64-v3 /usr/local/bin/

      - name: 提取 init_boot.img
        run: |
          mkdir -p output
          payload-dumper-linux-amd64-v3 extract "${{ env.FIRMWARE_LINK }}" -p boot
          ls -lh output/

      - name: 上传提取的镜像文件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_NAME }}-img
          path: output/${{ env.TARGET_NAME }}.img
          retention-days: 7
